name: Build PVGPU Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Install and Integrate WDK Package
      shell: powershell
      run: |
        nuget install Microsoft.Windows.WDK.x64 -OutputDirectory C:\wdk -Version 10.0.26100.2454
        
        $wdkPkg = Get-ChildItem "C:\wdk\Microsoft.Windows.WDK.x64.*" | Select-Object -First 1
        $winKits = "C:\Program Files (x86)\Windows Kits\10"

        # Copy missing libraries and binary tooling into standard Windows Kits directory
        if (Test-Path "$($wdkPkg.FullName)\build\native") {
            Copy-Item -Path "$($wdkPkg.FullName)\build\native\*" -Destination $winKits -Recurse -Force
        }

        # Locate extracted x64 km library path for explicit linking parameter
        $wdkLib = Get-ChildItem "C:\wdk\Microsoft.Windows.WDK.x64.*\build\native\Lib\*\km\x64" | Select-Object -First 1
        "WDK_LIB_PATH=$($wdkLib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Build Driver Solution
      shell: powershell
      run: |
        msbuild driver/pvgpu.sln `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:SpectreMitigation=false `
          /p:WindowsTargetPlatformVersion=10.0.26100.0 `
          /p:EnableInf2Cat=false `
          /p:Inf2CatUseLocalTime=true `
          /p:DriverPackaging=false `
          /p:InfVerif=false `
          /p:LinkAdditionalLibraryDirectories="$env:WDK_LIB_PATH"
