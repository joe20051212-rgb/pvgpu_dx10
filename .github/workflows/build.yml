name: Build PVGPU Drivers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Windows Driver Kit (WDK)
      shell: cmd
      run: |
        choco install windowsdriverkit-10 -y
        "C:\Program Files\7-Zip\7z.exe" x "C:\Program Files (x86)\Windows Kits\10\Vsix\VS2022\WDK.vsix" -oC:\Temp\WDK -y
        xcopy C:\Temp\WDK\*\* "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\" /E /I /Y

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Solution
      run: msbuild driver/pvgpu.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Built Drivers
      uses: actions/upload-artifact@v4
      with:
        name: pvgpu_drivers
        path: driver/bin/Release/x64/
