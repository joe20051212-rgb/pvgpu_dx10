name: Build PVGPU Drivers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install WDK via NuGet
      id: wdk
      shell: pwsh
      run: |
        nuget install Microsoft.Windows.WDK.x64 -OutputDirectory C:\wdk
        
        # Merge the NuGet package into the standard Windows Kits folder
        $winKits = "C:\Program Files (x86)\Windows Kits\10"
        $packages = Get-ChildItem "C:\wdk\Microsoft.Windows.*"
        foreach ($pkg in $packages) {
            Write-Host "Merging $($pkg.Name) into Windows Kits..."
            Copy-Item -Path "$($pkg.FullName)\*" -Destination $winKits -Recurse -Force
        }
        
        # Auto-detect the SDK version that was just installed by NuGet
        $libDir = Get-ChildItem "$winKits\Lib\10.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
        $version = $libDir.Name
        Write-Host "Detected WDK Version: $version"
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Solution
      run: msbuild driver/pvgpu.sln /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false /p:WindowsTargetPlatformVersion=${{ steps.wdk.outputs.version }}

    - name: Upload Built Drivers
      uses: actions/upload-artifact@v4
      with:
        name: pvgpu_drivers
        path: driver/bin/Release/x64/
