name: Build PVGPU Drivers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install WDK
      shell: pwsh
      run: |
        Write-Host "Downloading WDK installer..."
        curl.exe -L -o wdksetup.exe "https://go.microsoft.com/fwlink/?linkid=2196231"
        Write-Host "Installing WDK silently..."
        $p = Start-Process -FilePath ".\wdksetup.exe" -ArgumentList "/quiet", "/norestart" -Wait -PassThru
        Write-Host "WDK installer exit code: $($p.ExitCode)"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Solution
      run: msbuild driver/pvgpu.sln /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false

    - name: Upload Built Drivers
      uses: actions/upload-artifact@v4
      with:
        name: pvgpu_drivers
        path: driver/bin/Release/x64/
