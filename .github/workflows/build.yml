name: Build PVGPU Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Install and Integrate WDK Package
      shell: powershell
      run: |
        nuget install Microsoft.Windows.WDK.x64 -OutputDirectory C:\wdk -Version 10.0.26100.2454
        
        $wdkPkg = Get-ChildItem "C:\wdk\Microsoft.Windows.WDK.x64.*" | Select-Object -First 1
        $winKits = "C:\Program Files (x86)\Windows Kits\10"
        
        Write-Host "WDK Package: $($wdkPkg.FullName)"
        
        # Copy build files
        if (Test-Path "$($wdkPkg.FullName)\build\native") {
            Write-Host "Copying WDK build files..."
            Copy-Item -Path "$($wdkPkg.FullName)\build\native\*" -Destination $winKits -Recurse -Force
        }
        
        # Copy lib files (critical for dxgkrnl.lib)
        if (Test-Path "$($wdkPkg.FullName)\lib") {
            Write-Host "Copying WDK lib files..."
            Copy-Item -Path "$($wdkPkg.FullName)\lib\*" -Destination "$winKits\Lib" -Recurse -Force
        }
        
        # Find and set the KM lib path
        $kmLibPath = (Get-ChildItem "$winKits\Lib\10.0.26100.0\km\x64" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        if (-not $kmLibPath) {
            $kmLibPath = (Get-ChildItem "C:\wdk\Microsoft.Windows.WDK.x64.*\lib\*\km\x64" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        }
        
        Write-Host "KM Lib Path: $kmLibPath"
        "DDK_LIB_PATH=$kmLibPath" | Out-File -FilePath $env:GITHUB_ENV -Append
        
        # Verify dxgkrnl.lib exists
        $dxgkrnlPath = "$winKits\Lib\10.0.26100.0\km\x64\dxgkrnl.lib"
        if (Test-Path $dxgkrnlPath) {
            Write-Host "✓ Found dxgkrnl.lib at: $dxgkrnlPath"
        } else {
            Write-Host "✗ WARNING: dxgkrnl.lib not found at expected location"
            Write-Host "Searching for dxgkrnl.lib in WDK package..."
            Get-ChildItem "C:\wdk" -Recurse -Filter "dxgkrnl.lib" | ForEach-Object { Write-Host "Found: $($_.FullName)" }
        }

    - name: Build Driver Solution
      shell: powershell
      run: |
        $libPath = $env:DDK_LIB_PATH
        Write-Host "Using library path: $libPath"
        
        msbuild driver/pvgpu.sln `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:SpectreMitigation=false `
          /p:WindowsTargetPlatformVersion=10.0.26100.0 `
          /p:DDK_LIB_PATH="$libPath" `
          /p:EnableInf2Cat=false `
          /p:Inf2CatUseLocalTime=true `
          /p:DriverPackaging=false `
          /p:InfVerif=false
