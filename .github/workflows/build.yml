name: Build PVGPU Drivers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Windows Driver Kit (WDK)
      shell: powershell
      run: |
        Write-Host "Downloading WDK installer..."
        Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196231" -OutFile "wdksetup.exe"
        
        # Unblock the file so Windows allows it to execute
        Unblock-File -Path "wdksetup.exe"
        
        Write-Host "Installing WDK silently..."
        $proc = Start-Process -FilePath ".\wdksetup.exe" -ArgumentList "/quiet", "/norestart" -Wait -PassThru
        Write-Host "WDK installer exit code: $($proc.ExitCode)"
        
        # Fallback: Manually extract the MSBuild targets just in case VS integration was skipped
        $vsixPath = "C:\Program Files (x86)\Windows Kits\10\Vsix\VS2022\WDK.vsix"
        if (Test-Path $vsixPath) {
            Write-Host "Extracting WDK MSBuild targets..."
            & "C:\Program Files\7-Zip\7z.exe" x $vsixPath -o"C:\Temp\WDK" -y
            xcopy 'C:\Temp\WDK\$MSBuild\*' "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\" /E /I /Y
        } else {
            Write-Host "WARNING: WDK VSIX not found!"
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Solution
      run: msbuild driver/pvgpu.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Built Drivers
      uses: actions/upload-artifact@v4
      with:
        name: pvgpu_drivers
        path: driver/bin/Release/x64/
