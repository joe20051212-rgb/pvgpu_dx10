name: Build PVGPU Drivers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install WDK via NuGet
      shell: pwsh
      run: |
        nuget install Microsoft.Windows.WDK.x64 -OutputDirectory C:\wdk
        $winKits = "C:\Program Files (x86)\Windows Kits\10"
        $packages = Get-ChildItem "C:\wdk\Microsoft.Windows.*"
        foreach ($pkg in $packages) {
            Write-Host "Merging $($pkg.Name) into Windows Kits..."
            Copy-Item -Path "$($pkg.FullName)\*" -Destination $winKits -Recurse -Force
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Solution
      run: msbuild driver/pvgpu.sln /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false /p:WindowsTargetPlatformVersion=10.0.22621.0

    - name: Upload Built Drivers
      uses: actions/upload-artifact@v4
      with:
        name: pvgpu_drivers
        path: driver/bin/Release/x64/
