name: Build PVGPU Drivers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Install Windows SDK
      run: |
        choco install windows-sdk-10.1 -y
        choco install wixtoolset -y

    - name: Build Solution
      run: msbuild driver/pvgpu.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Built Drivers
      uses: actions/upload-artifact@v4
      with:
        name: pvgpu_drivers
        path: driver/bin/Release/x64/
