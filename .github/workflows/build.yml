name: Build PVGPU Drivers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install WDK via NuGet
      id: wdk
      shell: pwsh
      run: |
        nuget install Microsoft.Windows.WDK.x64 -OutputDirectory C:\wdk

        $winKits = "C:\Program Files (x86)\Windows Kits\10"
        $wdkPkg = Get-ChildItem "C:\wdk\Microsoft.Windows.WDK.x64.*" | Select-Object -First 1
        
        if (Test-Path "$($wdkPkg.FullName)\build\native") {
            Copy-Item -Path "$($wdkPkg.FullName)\build\native\*" -Destination $winKits -Recurse -Force
        } else {
            Copy-Item -Path "$($wdkPkg.FullName)\*" -Destination $winKits -Recurse -Force
        }

        $libDir = Get-ChildItem "$winKits\Lib\10.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
        $version = $libDir.Name
        Write-Host "Detected WDK Version: $version"
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      shell: pwsh
      env:
        LIB: C:\Program Files (x86)\Windows Kits\10\lib\10.0.26100.0\km\x64;%LIB%
      run: |
        $version = "${{ steps.wdk.outputs.version }}"
        msbuild driver/pvgpu.sln `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:SpectreMitigation=false `
          /p:WindowsTargetPlatformVersion=$version `
          /p:EnableInf2Cat=false `
          /p:Inf2CatUseLocalTime=true `
          /p:DriverPackaging="false" `
          /p:InfVerif="false"

    - name: Upload Built Drivers
      uses: actions/upload-artifact@v4
      with:
        name: pvgpu_drivers
        path: driver/bin/Release/x64/
