name: Build PVGPU Drivers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install WDK via NuGet
      shell: pwsh
      run: |
        nuget install Microsoft.Windows.WDK.x64 -OutputDirectory C:\wdk
        # The runner has the 10.0.26100.0 SDK installed, but is missing dxgkrnl.lib.
        # We auto-find dxgkrnl.lib in the NuGet package and copy it to the correct folder.
        $libPath = "C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\km\x64"
        $dxgkrnllib = Get-ChildItem "C:\wdk\Microsoft.Windows.WDK.x64.*\build\Lib\*\km\x64\dxgkrnl.lib" -Recurse | Select-Object -First 1
        if ($dxgkrnllib) {
            Copy-Item $dxgkrnllib.FullName -Destination $libPath -Force
            Write-Host "Copied dxgkrnl.lib to $libPath"
        } else {
            Write-Error "dxgkrnl.lib not found in NuGet package!"
            exit 1
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Solution
      run: msbuild driver/pvgpu.sln /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false

    - name: Upload Built Drivers
      uses: actions/upload-artifact@v4
      with:
        name: pvgpu_drivers
        path: driver/bin/Release/x64/
