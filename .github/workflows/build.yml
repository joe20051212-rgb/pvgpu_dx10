name: Build PVGPU Drivers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install WDK via NuGet
      shell: pwsh
      run: |
        nuget install Microsoft.Windows.WDK.x64 -OutputDirectory C:\wdk
        $wdkPkg = Get-ChildItem "C:\wdk\Microsoft.Windows.WDK.x64.*" | Select-Object -First 1
        $buildDir = Join-Path $wdkPkg.FullName "build"
        if (Test-Path $buildDir) {
            $dest = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\"
            Write-Host "Copying WDK MSBuild targets from $buildDir to $dest"
            Copy-Item -Path "$buildDir\*" -Destination $dest -Recurse -Force
        } else {
            Write-Error "Build directory not found in WDK NuGet package!"
            exit 1
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Solution
      run: msbuild driver/pvgpu.sln /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false

    - name: Upload Built Drivers
      uses: actions/upload-artifact@v4
      with:
        name: pvgpu_drivers
        path: driver/bin/Release/x64/
